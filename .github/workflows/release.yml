name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # нужно для создания релиза
  id-token: write   # нужно для подписи происхождения артефактов
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна для проверки ниже: по мелкой копии
          # merge-base не отработает.
          fetch-depth: 0

      # Тег, поставленный на unstable по ошибке, выпустил бы непроверенную
      # сборку под видом релиза. Дешевле проверить здесь, чем отзывать.
      - name: Проверить, что тег стоит на main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Коммит $GITHUB_SHA отсутствует в истории main."
            echo "Релизы выпускаются только с main; сначала влейте unstable."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Сборка релизных бинарников
        env:
          VERSION: ${{ github.ref_name }}
          # Fill от PaperMC требует осмысленный User-Agent с контактом,
          # поэтому адрес репозитория подставляется в бинарник при сборке.
          CONTACT_URL: https://github.com/${{ github.repository }}
        run: make dist

      # Подтверждение происхождения: проверяется командой
      # gh attestation verify <файл> --repo <владелец>/<репозиторий>
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/izba-*'

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
